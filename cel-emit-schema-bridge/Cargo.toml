[package]
name = "cel-emit-schema-bridge"
description = "What cel-emit's computed properties take, built from a JSON Schema through schema-emit."
version = "0.0.0"
edition = "2021"
license = "MPL-2.0"
readme = "README.md"
publish = false

[dependencies]
cel-emit = { path = ".." }
# The schema's models, their Rust, and each property's check.
schema-emit = { git = "https://github.com/nodeve-com/schema-emit", rev = "d59b7e35a5a57c15e966e468265244ed59bb21d2" }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
too_many_lines = "warn"

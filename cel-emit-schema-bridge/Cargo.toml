[package]
name = "cel-emit-schema-bridge"
description = "What cel-emit's computed properties take, built from a JSON Schema through schema-emit."
version = "0.11.0"
edition = "2021"
license = "MPL-2.0"
repository = "https://github.com/nodeve-com/cel-emit"
include = ["/src", "/README.md", "/LICENSE"]

[dependencies]
cel-emit = { path = "..", version = "0.9.0" }
# The schema's models, their Rust, and each property's check.
schema-emit = "0.7.2"

[dev-dependencies]
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
too_many_lines = "warn"

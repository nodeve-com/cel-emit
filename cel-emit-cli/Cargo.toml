[package]
name = "cel-emit-cli"
description = "A CEL expression over JSON in, a Rust program out."
version = "0.0.0"
edition = "2021"
license = "MPL-2.0"
readme = "README.md"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "cel-emit"
path = "src/main.rs"

[dependencies]
cel-emit = { path = ".." }
# A schema's types and their decode.
schema-emit = { git = "https://github.com/nodeve-com/schema-emit", rev = "203b67680ea888de58c59af2df5c728787109df3" }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
# Formats the Rust it writes.
prettyplease = "0.2"
syn = { version = "2", features = ["full", "parsing"] }

[dev-dependencies]
cel-emit-runtime = { path = "../cel-emit-runtime", features = ["civil"] }
schema-emit-runtime = { git = "https://github.com/nodeve-com/schema-emit", rev = "203b67680ea888de58c59af2df5c728787109df3", features = ["decode"] }
# An expression checked ahead of time and saved as a `CheckedExpr`, for the interpreter program
# (tests/references.rs).
cel-core = { git = "https://github.com/nodeve-com/cel-core", branch = "loom" }
cel-core-proto = { git = "https://github.com/nodeve-com/cel-core", branch = "loom" }
prost = "0.14"

[lints.clippy]
too_many_lines = "warn"
